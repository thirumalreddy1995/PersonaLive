    <script>
      // Emscripten/WASM forwards C++ stderr to console.error. TensorFlow Lite / MediaPipe
      // writes informational startup notices (such as "INFO: Created TensorFlow Lite XNNPACK delegate for CPU.")
      // to stderr. Re-route benign INFO logs to console.info so automated monitors do not report them as errors.
      (function() {
        var origError = console.error;
        console.error = function() {
          var first = arguments[0];
          if (typeof first === 'string' && (first.startsWith('INFO:') || first.includes('Created TensorFlow Lite') || first.includes('XNNPACK delegate'))) {
            return console.info.apply(console, arguments);
          }
          return origError.apply(console, arguments);
        };
      })();
    </script>
