name: Deploy Web App to GitHub Pages

# Every push to main builds the studio and publishes dist/ to the gh-pages branch, which GitHub
# serves at https://<owner>.github.io/<repo>/. Installed desktop PWAs that were installed from
# that URL pick the new build up automatically (service worker update → "Update Ready" button).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build (served under /<repo>/)
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Publish dist/ to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          commit_message: 'Deploy ${{ github.sha }}'
