name: Build & Release PersonaLive Desktop

# Push a version tag (e.g. `git tag v2.5.1 && git push --tags`) to build Windows and macOS
# installers and publish them to GitHub Releases. Installed desktop apps update themselves
# from there via electron-updater.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # publish GitHub Releases

jobs:
  build-and-release:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (face math + mesh topology)
        run: npm test

      - name: Build web bundle
        run: npm run build

      - name: Build & publish desktop installer
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
